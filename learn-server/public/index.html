<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>learn://session</title>
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>▚</text></svg>" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="bar">
			<span class="dot" id="status-dot"></span>
			<span class="bar-title">learn</span>
			<span class="bar-path" id="bar-path" title="the file this lesson is being saved to">no session yet</span>
			<span class="bar-model" id="bar-model" title="self-reported by the teaching agent"></span>
			<span class="bar-right">
				<button class="chip map-pill" id="btn-map" type="button" title="show / hide the progress map (m)" hidden>map <span id="map-pill-stats"></span></button>
				<button class="chip ask-btn" id="btn-ask" type="button" title="ask the teacher a question (?)">ask ?</button>
				<button class="chip" id="btn-sessions" type="button">sessions</button>
				<button class="chip" id="btn-new" type="button">new</button>
				<span class="conn" id="bar-conn">connecting…</span>
			</span>
		</header>


		<div class="archive-bar" id="archive-bar" hidden>
			<span id="archive-name"></span>
			<button class="chip" id="btn-live" type="button">← back to live</button>
		</div>

		<main id="stream" class="stream">
			<div class="boot">
				<pre class="logo">
 ┌──────────────────────────────────────────┐
 │  l e a r n                               │
 │  unconditional truths → derived nodes    │
 └──────────────────────────────────────────┘</pre>
				<p class="muted">Connecting…</p>
			</div>
		</main>

		<aside class="map" id="map" hidden>
			<div class="map-head">
				<span class="map-title" id="map-title">map</span>
				<button class="chip" id="btn-map-toggle" type="button" title="hide the map (m)">hide</button>
			</div>
			<div class="map-bar"><div class="map-fill" id="map-fill"></div></div>
			<div class="map-stats" id="map-stats"></div>
			<div class="map-body" id="map-body"></div>
			<div class="map-legend">
				<span><i class="st todo"></i>todo</span><span><i class="st learning"></i>learning</span><span><i class="st shaky"></i>shaky</span><span><i class="st solid"></i>solid</span>
			</div>
		</aside>

		<button class="jump" id="btn-jump" type="button" hidden>↓ latest</button>

		<aside class="drawer" id="drawer" hidden>
			<div class="drawer-head">
				<span>sessions</span>
				<button class="chip" id="btn-close-drawer" type="button">esc</button>
			</div>
			<div class="drawer-search">
				<input id="session-filter" type="search" placeholder="filter lessons…" autocomplete="off" />
			</div>
			<ul class="session-list" id="session-list"></ul>
		</aside>
		<div class="scrim" id="scrim" hidden></div>

		<div class="ask" id="ask" hidden>
			<div class="ask-head">
				<span>ask the teacher</span>
				<button class="chip" id="btn-ask-close" type="button">esc</button>
			</div>
			<textarea id="ask-input" rows="3" placeholder="Anything you're confused about. Enter sends, shift+enter for a new line."></textarea>
			<div class="ask-foot">
				<span class="ask-status" id="ask-status"></span>
				<button class="submit" id="btn-ask-send" type="button">SEND ⏎</button>
			</div>
		</div>

		<footer class="hint" id="hint"></footer>

		<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>
